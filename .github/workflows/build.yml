name: Build (Linux)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libboost-dev libgc-dev

      - name: Build
        run: make -f Makefile.linux

      - name: Smoke test
        run: echo '(+ 1 2 3)' | ./scheme12_debug
